<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Orchvate</title>
    <link rel="stylesheet" href="universal-styles.css" />
  </head>
  <body class="thank-you-page">
    <div class="thank-you-container">
      <img
        src="assests/mc-c2e0273b.png"
        alt="Orchvate"
      />

      <div class="checkmark">
        <svg viewBox="0 0 52 52">
          <polyline points="14 27 22 35 38 19" />
        </svg>
      </div>

      <h1>Thank you!</h1>

      <p id="thank-you-message">We've sent you a confirmation email to complete your subscription.</p>

      <div class="divider"></div>

      <p id="check-inbox-message">
        Please check your inbox to confirm your email address.
      </p>

      <script>
        document.addEventListener('DOMContentLoaded', function() {
          const urlParams = new URLSearchParams(window.location.search);
          const status = urlParams.get('status');
          if (status) {
            const heading = document.querySelector('h1');
            const mainMsg = document.getElementById('thank-you-message');
            const subMsg = document.getElementById('check-inbox-message');
            const divider = document.querySelector('.divider');
            
            let title = "Thank You!";
            let message1 = "We've sent you a confirmation email to complete your subscription.";
            let message2 = "Please check your inbox and confirm your email address.";

            if (status === "pending") {
              title = "Almost There!";
              message1 = "You've already signed up for the Orchvate newsletter.";
              message2 = "Please confirm your email using the link in your inbox.";
            } else if (status === "verified") {
              title = "You're Already Subscribed!";
              message1 = "This email address is already subscribed to the Orchvate newsletter.";
              message2 = "You'll continue receiving updates from our team.";
            } else if (status !== "new") {
              // Fallback for unexpected status values (displaying it as the main message)
              message1 = status;
              if (status.toLowerCase().includes('already')) {
                title = "Subscription Status";
                message2 = "";
              }
            }

            heading.textContent = title;
            mainMsg.textContent = message1;
            
            if (message2) {
              if (subMsg) {
                subMsg.textContent = message2;
                subMsg.style.display = 'block';
              }
              if (divider) divider.style.display = 'block';
            } else {
              if (subMsg) subMsg.style.display = 'none';
              if (divider) divider.style.display = 'none';
            }
          }
        });
      </script>

     

      <p class="footer-text">
        With gratitude,<br /><strong>The Orchvate Team</strong>
      </p>
    </div>
  </body>
</html>
